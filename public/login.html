<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Escucha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var th = localStorage.getItem('escucha-theme');
      if (!th && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) th = 'dark';
      if (th) document.documentElement.dataset.theme = th;
    } catch (e) { /* sin almacenamiento: tema claro */ }
  </script>
</head>
<body>
  <div class="login-wrap">
    <main class="card login-card">
      <div class="logo-row" style="border:0;height:auto;padding:0;margin:0"><span class="logo-mark"><i class="fa-solid fa-satellite-dish"></i></span><span class="logo-name">Think4Ever <span>Escucha</span></span></div>
      <div>
        <h1 class="page-title" style="font-size:20px">Agente de escucha</h1>
        <p class="card-sub" style="margin-top:6px">Cola de hilos de Reddit, Hacker News y GitHub, con borradores para revisar y publicar.</p>
      </div>
      <a class="btn btn-primary" href="auth/login"><i class="fa-brands fa-microsoft"></i>Iniciar sesión con Microsoft</a>
      <p class="login-note">Solo cuentas @think4ever.com. Si no tienes acceso, pídeselo al equipo de Research.</p>
    </main>
  </div>
</body>
</html>

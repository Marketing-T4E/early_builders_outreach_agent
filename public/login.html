<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cola de escucha</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5d6576; --line: #dfe3ea; --accent: #2457d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e7e9ee; --muted: #9aa3b2; --line: #2d333d; --accent: #7fa2ff; }
  }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: grid; place-items: center; padding: 0 16px; }
  .box { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  a.btn { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none;
    border-radius: 6px; padding: 10px 14px; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <h1>Cola de escucha · Think4Ever</h1>
    <p>Entra con tu cuenta de Microsoft de Think4Ever.</p>
    <a class="btn" href="auth/login">Iniciar sesión con Microsoft</a>
  </div>
</body>
</html>

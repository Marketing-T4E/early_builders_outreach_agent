<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cola de escucha</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5d6576; --line: #dfe3ea;
    --accent: #2457d6; --ok: #1f7a4d; --warn: #9a6400; --err: #b42318; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e7e9ee; --muted: #9aa3b2; --line: #2d333d;
      --accent: #7fa2ff; --ok: #5fcf96; --warn: #f0b44c; --err: #ff8a80; --chip: #262b34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  button, select { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; }
  nav button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 16px; padding: 0 16px 24px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .card.sel { border-color: var(--accent); }
  .card .t { font-weight: 600; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
  .chip.err { color: var(--err); } .chip.warn { color: var(--warn); } .chip.ok { color: var(--ok); }
  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
  .detail h2 { font-size: 17px; margin: 0 0 4px; overflow-wrap: anywhere; }
  .excerpt { white-space: pre-wrap; background: var(--chip); border-radius: 6px; padding: 10px; max-height: 220px;
    overflow: auto; font-size: 13px; color: var(--muted); }
  textarea { width: 100%; min-height: 220px; font: 14px/1.5 ui-monospace, Consolas, monospace; padding: 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  ul.issues { margin: 6px 0; padding-left: 18px; }
  .err { color: var(--err); } .warn { color: var(--warn); } .ok { color: var(--ok); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .events { font-size: 12px; color: var(--muted); }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 6px; display: none; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Cola de escucha · Think4Ever</h1>
    <div class="meta" id="me">Cargando…</div>
  </div>
  <div class="row" style="margin:0">
    <select id="source" aria-label="Fuente">
      <option value="">Todas las fuentes</option>
      <option value="reddit">Reddit</option>
      <option value="hn">Hacker News</option>
      <option value="github">GitHub Discussions</option>
    </select>
    <button id="scan">Buscar ahora</button>
    <button id="report">Reporte 7 días</button>
    <a href="auth/logout"><button>Cerrar sesión</button></a>
  </div>
</header>
<nav id="tabs"></nav>
<main>
  <section class="list" id="list"></section>
  <section class="detail" id="detail"><div class="empty">Elige un hilo de la lista.</div></section>
</main>
<div id="toast"></div>
<script>
const TABS = [
  ['en_cola', 'En cola'], ['aprobado', 'Aprobados'], ['publicado', 'Publicados'],
  ['descartado', 'Descartados'], ['no_relevante', 'No relevantes'], ['error', 'Errores'],
];
const SRC = { reddit: 'Reddit', hn: 'Hacker News', github: 'GitHub' };
let state = { tab: 'en_cola', source: '', items: [], sel: null, me: null };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', ...opts });
  if (res.status === 401) { location.href = 'login.html'; throw new Error('Sesión vencida'); }
  const data = res.headers.get('content-type')?.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error(data.error || 'Error');
  return data;
}

async function loadMe() {
  state.me = await api('api/me');
  $('me').textContent = `${state.me.user.email} · publicadas hoy ${state.me.postsToday}/${state.me.maxPostsPerDay}`
    + ` · enlaces ${state.me.linksEnabled ? 'activos' : 'apagados (fase sin enlaces)'}`;
}

async function loadList() {
  const q = new URLSearchParams({ status: state.tab });
  if (state.source) q.set('source', state.source);
  const data = await api('api/queue?' + q);
  state.items = data.items;
  $('tabs').innerHTML = TABS.map(([k, label]) =>
    `<button data-tab="${k}" class="${k === state.tab ? 'active' : ''}">${label} (${data.counts[k] || 0})</button>`).join('');
  $('list').innerHTML = state.items.length ? state.items.map((t) => `
    <div class="card ${state.sel === t.id ? 'sel' : ''}" data-id="${t.id}">
      <div class="t">${esc(t.title)}</div>
      <div class="chips">
        <span class="chip">${SRC[t.source]} · ${esc(t.community)}</span>
        ${t.relevance_score != null ? `<span class="chip">relevancia ${t.relevance_score}</span>` : ''}
        ${t.persona ? `<span class="chip">${esc(t.persona.slice(0, 3))}</span>` : ''}
        ${t.lint && !t.lint.ok ? '<span class="chip err">revisar</span>' : ''}
        ${t.risks?.length ? '<span class="chip warn">riesgos</span>' : ''}
      </div>
    </div>`).join('') : '<div class="empty">Nada en este estado.</div>';
}

function renderDetail(t) {
  const editable = ['en_cola', 'aprobado'].includes(t.status);
  const issues = t.lint?.issues || [];
  $('detail').innerHTML = `
    <h2>${esc(t.title)}</h2>
    <div class="meta">${SRC[t.source]} · ${esc(t.community)} · ${esc(t.thread_created_at || '')} · tema ${esc(t.theme || '-')} · ${esc(t.persona || '-')} · ${esc(t.language || '-')}</div>
    <div class="row"><a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer"><button>Abrir hilo</button></a></div>
    <p><strong>Pregunta:</strong> ${esc(t.question_summary || '')}</p>
    <div class="excerpt">${esc(t.excerpt || '')}</div>
    ${t.risks?.length ? `<p class="warn"><strong>Riesgos:</strong></p><ul class="issues">${t.risks.map((r) => `<li class="warn">${esc(r)}</li>`).join('')}</ul>` : ''}
    <p><strong>Borrador</strong> ${t.edited_by ? `<span class="meta">editado por ${esc(t.edited_by)}</span>` : '<span class="meta">sin editar</span>'}</p>
    <textarea id="reply" ${editable ? '' : 'readonly'}>${esc(t.reply || '')}</textarea>
    ${issues.length ? `<ul class="issues">${issues.map((i) => `<li class="${i.level === 'error' ? 'err' : 'warn'}">${esc(i.msg)}</li>`).join('')}</ul>` : '<p class="ok">Revisión automática sin observaciones.</p>'}
    ${t.link_url ? `<p class="meta">Enlace con UTM: ${esc(t.link_url)}</p>` : ''}
    ${t.content_idea ? `<p class="meta"><strong>Idea de contenido:</strong> ${esc(t.content_idea)}</p>` : ''}
    <div class="row">
      <button id="copy">Copiar respuesta</button>
      ${editable ? '<button id="save">Guardar cambios</button>' : ''}
      ${t.status === 'en_cola' ? `<button id="approve" class="primary" ${t.lint?.ok ? '' : 'disabled'}>Aprobar</button>` : ''}
      ${t.status === 'aprobado' ? '<button id="posted" class="primary">Marcar publicado</button>' : ''}
      ${t.status !== 'publicado' ? '<button id="discard">Descartar</button>' : ''}
    </div>
    ${t.approved_by ? `<p class="meta">Aprobado por ${esc(t.approved_by)} (${esc(t.approved_at)})</p>` : ''}
    ${t.posted_url ? `<p class="meta">Publicado por ${esc(t.posted_by)}: <a href="${esc(t.posted_url)}" target="_blank" rel="noopener noreferrer">${esc(t.posted_url)}</a></p>` : ''}
    <div class="events">${(t.events || []).map((e) => `${esc(e.at)} · ${esc(e.actor)} · ${esc(e.action)}`).join('<br>')}</div>`;

  const act = async (fn, msg) => { try { renderDetail(await fn()); await loadList(); await loadMe(); toast(msg); } catch (e) { toast(e.message); } };
  $('copy').onclick = async () => { await navigator.clipboard.writeText($('reply').value); toast('Respuesta copiada. Publícala desde tu cuenta.'); };
  if ($('save')) $('save').onclick = () => act(() => api(`api/threads/${t.id}`, { method: 'PATCH', body: JSON.stringify({ reply: $('reply').value }) }), 'Guardado. La aprobación anterior se borró.');
  if ($('approve')) $('approve').onclick = () => {
    if ($('reply').value !== (t.reply || '')) { toast('Tienes cambios sin guardar. Guárdalos (y que otra persona apruebe) o recarga.'); return; }
    act(() => api(`api/threads/${t.id}/approve`, { method: 'POST', body: JSON.stringify({ seen: t.edited_at || '' }) }), 'Aprobado.');
  };
  if ($('posted')) $('posted').onclick = () => {
    const url = prompt('Pega la URL de tu respuesta publicada:');
    if (url) act(() => api(`api/threads/${t.id}/posted`, { method: 'POST', body: JSON.stringify({ url }) }), 'Registrado como publicado.');
  };
  if ($('discard')) $('discard').onclick = () => {
    const reason = prompt('Motivo del descarte:');
    if (reason !== null) act(() => api(`api/threads/${t.id}/discard`, { method: 'POST', body: JSON.stringify({ reason }) }), 'Descartado.');
  };
}

async function select(id) {
  state.sel = id;
  document.querySelectorAll('.card').forEach((c) => c.classList.toggle('sel', Number(c.dataset.id) === id));
  try { renderDetail(await api(`api/threads/${id}`)); } catch (e) { toast(e.message); }
}

$('tabs').onclick = (e) => { const k = e.target.dataset.tab; if (k) { state.tab = k; state.sel = null; $('detail').innerHTML = '<div class="empty">Elige un hilo de la lista.</div>'; loadList(); } };
$('list').onclick = (e) => { const c = e.target.closest('.card'); if (c) select(Number(c.dataset.id)); };
$('source').onchange = (e) => { state.source = e.target.value; loadList(); };
$('scan').onclick = async () => { try { await api('api/scan', { method: 'POST', body: '{}' }); toast('Búsqueda iniciada. Toma unos minutos; recarga la cola después.'); } catch (e) { toast(e.message); } };
$('report').onclick = () => window.open('api/report?days=7', '_blank', 'noopener');

loadMe().then(loadList).catch((e) => toast(e.message));
</script>
</body>
</html>
